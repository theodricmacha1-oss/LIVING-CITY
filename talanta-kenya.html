<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talanta Kenya</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#121a33;--muted:#586280;--line:#dbe0ee;--green:#1d4ed8;--gold:#c8102e;--red:#c8102e;--on-green:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--surface:#141b30;--ink:#eef1f8;--muted:#9aa5c0;--line:#263050;--green:#6a97f5;--gold:#ff5c77;--red:#ff5c77;--on-green:#08122b}}
:root[data-theme="dark"]{--bg:#0b1020;--surface:#141b30;--ink:#eef1f8;--muted:#9aa5c0;--line:#263050;--green:#6a97f5;--gold:#ff5c77;--red:#ff5c77;--on-green:#08122b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);background:var(--surface)}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.logo i{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--gold);margin-right:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 16px}
.seg button[aria-pressed=true]{background:var(--green);color:var(--on-green);font-weight:600}
nav{display:flex;gap:6px;padding:12px clamp(16px,4vw,40px);overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -3px var(--gold)}
main{padding:8px clamp(16px,4vw,40px) 60px;max-width:1100px;margin:0 auto}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filters input,.filters select,.form input,.form select,.form textarea{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{flex:1 1 200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.vid{aspect-ratio:9/12;display:grid;place-items:center;position:relative;color:#fff}
.vid b{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:1.4rem}
.vid small{position:absolute;right:10px;bottom:8px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:6px}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{margin:0;font-size:1.05rem}
.meta{color:var(--muted);font-size:.9rem}
.tick{color:var(--green);font-weight:600;font-size:.85rem}
.row{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
.btn.pri{background:var(--green);color:var(--on-green);border-color:var(--green);font-weight:600}
.btn.on{background:var(--gold);color:#16211c;border-color:var(--gold)}
.opp{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:12px;padding:16px;margin-bottom:14px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.opp h3{margin:0 0 2px}
.status{font-weight:600;color:var(--green)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;margin-bottom:20px}
.empty{padding:40px 0;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
h2{margin:8px 0 14px}
.chat{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:14px}
@media(max-width:600px){.chat{grid-template-columns:1fr}}
.threads{display:flex;flex-direction:column;gap:8px}
.thr{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.thr.sel{border-color:var(--green);box-shadow:inset 4px 0 var(--green)}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.msgs{height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bg);align-self:flex-start}
.m.me{background:var(--green);color:var(--on-green);align-self:flex-end}
.send{display:flex;gap:8px}.send input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prof{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.av{width:72px;height:72px;border-radius:50%;background:var(--gold);color:#16211c;display:grid;place-items:center;font-weight:800;font-size:1.5rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:1.7rem}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);overflow:visible}
nav button{flex:1;text-align:center;font-size:.85rem;padding:10px 4px;border-radius:8px}
nav button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 3px var(--gold)}
main{padding-bottom:110px}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.hero{padding:28px 0 20px}.hero h1{margin:0;font-size:clamp(1.9rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}.hero p{margin:6px 0 0;color:var(--muted);font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:14px;padding:20px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.tile b{font-size:1.2rem}.tile:hover{border-color:var(--green);border-top-color:var(--green)}
.bar{height:10px;border-radius:5px;background:var(--gold);margin:4px 0 10px}
header{background:#0b1a14;color:#fff;border-bottom:4px solid var(--gold);padding-top:8px;padding-bottom:8px}
header img{display:block;height:60px;width:auto}
.seg{border-color:rgba(255,255,255,.4)}
.seg button[aria-pressed=true]{background:var(--gold);color:#16211c}
.hero{background:radial-gradient(circle at 85% 20%,rgba(242,183,5,.35),transparent 45%),linear-gradient(135deg,#0b1a14,#0f4d3a 55%,#7a1626);color:#fff;border-radius:20px;padding:24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:16px 0 22px}
.hero img{height:auto;max-width:40vw}
.hero h1{color:#fff}.hero p{color:#e3efe7}
.tile:nth-child(6n+1){--c:#f2b705}.tile:nth-child(6n+2){--c:#e5202e}.tile:nth-child(6n+3){--c:#14a85a}.tile:nth-child(6n+4){--c:#8b3fd9}.tile:nth-child(6n+5){--c:#ff7a1a}.tile:nth-child(6n+6){--c:#1f7ae0}
.tile{border-top:6px solid var(--c,var(--gold));background:linear-gradient(180deg,color-mix(in srgb,var(--c,#f2b705) 16%,var(--surface)),var(--surface))}
.tile:hover{border-color:var(--c);border-top-color:var(--c)}
.chip[aria-pressed=true]{background:linear-gradient(90deg,#e5202e,#f2b705);color:#fff;border-color:transparent}
.btn.pri{background:linear-gradient(135deg,#0a8f4e,#0f6b3d);border-color:transparent;color:#fff}
nav button.plus{flex:0 0 66px;width:66px;height:66px;margin-top:-30px;padding:0;border-radius:50%;border:4px solid var(--surface);background:linear-gradient(135deg,#f2b705,#e5202e);color:#fff;font-size:2.4rem;font-weight:400;line-height:1;box-shadow:0 6px 18px rgba(229,32,46,.45)}
nav button.plus[aria-selected=true]{box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(229,32,46,.45)}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:800;text-align:left;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.vid.sq{aspect-ratio:1}.vid audio{width:88%}.ptxt{margin:0;padding:16px;font-weight:600;text-align:center}
.banner{display:flex;gap:18px;align-items:center;flex-wrap:wrap;color:#fff;border-radius:20px;padding:24px;margin:16px 0}
.banner h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem)}.banner p{margin:6px 0 0;max-width:52ch}
.av.big{width:96px;height:96px;font-size:2rem;border:4px solid #fff}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px}
.pa{flex:0 0 92px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.pa .av{width:72px;height:72px;border:3px solid var(--gold)}
header{background:linear-gradient(135deg,#071a47,#0b2a6f)}
.seg button[aria-pressed=true],.btn.on{color:#fff}
.av{color:#fff}
.hero{background:radial-gradient(circle at 85% 20%,rgba(200,16,46,.5),transparent 50%),linear-gradient(135deg,#071a47,#0b2a6f 60%,#7a0f26)}
.tile:nth-child(odd){--c:#1d4ed8}.tile:nth-child(even){--c:#c8102e}
.chip[aria-pressed=true]{background:linear-gradient(90deg,#1d4ed8,#c8102e);color:#fff}
.btn.pri{background:linear-gradient(135deg,#1d4ed8,#1a3fae);color:#fff}
nav button{font-size:.78rem}
nav button.plus{background:linear-gradient(135deg,#1d4ed8,#c8102e);box-shadow:0 6px 18px rgba(29,78,216,.45);font-size:2.4rem}
nav button.plus[aria-selected=true]{box-shadow:0 0 0 3px var(--gold),0 6px 18px rgba(29,78,216,.45)}
#sv{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#sv[hidden]{display:none}
.bars{display:flex;gap:4px;z-index:2}.bars i{flex:1;height:4px;background:rgba(255,255,255,.35);border-radius:2px;position:relative;overflow:hidden}
.bars i.done{background:#fff}.bars i.run::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:fill 4s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-top:10px;z-index:2}
#sv img,#sv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.stx{margin:auto;font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;text-align:center;max-width:20ch;z-index:1;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.sp,.sn{position:absolute;top:90px;bottom:0;width:40%;background:none;border:0}.sp{left:0}.sn{right:0}
:root:root:root{color-scheme:dark;--bg:#000;--surface:#0e0e11;--ink:#f3f3f6;--muted:#9a9aa8;--line:#23232a;--green:#3b82f6;--gold:#e0143c;--red:#e0143c;--on-green:#fff}
header{background:#000;border-bottom:2px solid var(--gold)}
.hero{background:radial-gradient(circle at 85% 0%,rgba(29,78,216,.35),transparent 55%),#000;border:1px solid var(--line)}
.tile{background:var(--surface);border-top-width:3px}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
.btn.pri{background:var(--green);color:#fff}
.opp{border-left-width:4px}
nav{background:#000}
nav button.plus{border-color:#000}
.seg button[aria-pressed=true]{background:var(--gold);color:#fff}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:14px 0}
.cnt{display:flex;gap:22px;margin-top:8px}.cnt div{display:flex;flex-direction:column;align-items:center}.cnt b{font-size:1.2rem}.cnt span{color:var(--muted);font-size:.85rem}
.igtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}.sw>span{display:flex;flex-direction:column}.sw input{width:22px;height:22px;accent-color:var(--green)}
.lnk.m{font-weight:400;color:var(--muted);text-decoration-color:var(--line)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
#pv{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}#pv[hidden]{display:none}
.pbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;flex-direction:column;gap:6px}
header #chatb{margin-left:auto}.out .seg,.out #bell,.out #chatb{display:none}
.amsg{min-height:1.4em;color:var(--gold);font-weight:600;margin:4px 0}
.pwrow{display:flex;gap:8px}.pwrow input{flex:1}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.chk{display:flex;gap:10px;align-items:flex-start}.form input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--green);flex:0 0 auto}
#tc{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px}#tc[hidden]{display:none}
.real .seg{display:none}
.shorts{height:calc(100vh - 250px);min-height:420px;overflow-y:auto;scroll-snap-type:y mandatory}
.short{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.smedia{flex:1;min-height:0;display:flex}.smedia .vid{flex:1;aspect-ratio:auto}.sinfo{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.m.warn{background:var(--gold);color:#fff}
.vid .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.vid b,.vid small{position:relative;z-index:1}.vid small{position:absolute}
.stx{background:rgba(0,0,0,.35);padding:8px 14px;border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="logo"><img id="hl" alt="Talanta Kenya" height="60"></div>
  <button class="btn" id="chatb">Chat</button>
  <button class="btn" id="bell">Alerts<span id="bc"></span></button>
  <div class="seg" role="group" aria-label="Viewing as">
    <button id="r-talent" aria-pressed="true">I'm a talent</button>
    <button id="r-scout" aria-pressed="false">I'm a scout</button>
    <button id="r-admin" aria-pressed="false">Admin</button>
  </div>
</header>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<div id="pv" hidden></div>
<div id="tc" hidden></div>
<div id="sv" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
